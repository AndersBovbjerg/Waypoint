<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The mark: one filled node (where you are), one open node (the next
       waypoint), one node-width of space between them. Heavier ring than
       the master here: at favicon size a 44 stroke silts the void up. -->
  <defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0B4FA6"/><stop offset=".55" stop-color="#0A84FF"/><stop offset="1" stop-color="#48BDFF"/></linearGradient></defs>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <circle cx="112" cy="256" r="48" fill="#FFFFFF"/><circle cx="352" cy="256" r="68" fill="none" stroke="#FFFFFF" stroke-width="56"/>
</svg>
